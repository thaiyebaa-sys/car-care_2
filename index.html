<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Care</title>
<style>
:root{--bg:#07111f;--card:#101d31cc;--line:#ffffff16;--text:#f4f7ff;--muted:#9aaac0;--a:#ff6b8a;--b:#7c5cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#ff6b8a33,transparent 28%),radial-gradient(circle at 90% 80%,#7c5cff44,transparent 30%),#07111f}.wrap{width:min(1000px,92%);margin:auto;padding:44px 0}.hero{display:flex;align-items:center;gap:18px;margin-bottom:24px}.icon{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-size:28px;box-shadow:0 15px 45px #0006}h1{font-size:clamp(30px,5vw,46px);margin:0}.sub{color:var(--muted);margin:7px 0}.chat{height:65vh;min-height:500px;border:1px solid var(--line);border-radius:28px;background:var(--card);backdrop-filter:blur(20px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 25px 80px #0007}.messages{flex:1;overflow:auto;padding:28px}.msg{max-width:80%;padding:14px 18px;border-radius:19px;line-height:1.55;margin-bottom:15px;white-space:pre-wrap}.bot{background:#17263d;border-top-left-radius:7px}.user{margin-left:auto;background:linear-gradient(135deg,var(--a),var(--b));border-top-right-radius:7px}.composer{display:flex;gap:10px;padding:15px;border-top:1px solid var(--line);background:#050b14aa}textarea{flex:1;height:56px;resize:none;border:1px solid var(--line);border-radius:17px;background:#091525;color:var(--text);padding:16px;outline:none;font:inherit}button{border:0;border-radius:17px;padding:0 24px;color:white;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer}.hint{text-align:center;color:#70819a;font-size:12px;margin-top:12px}@media(max-width:650px){.wrap{padding:25px 0}.chat{height:72vh}.msg{max-width:90%}button{padding:0 17px}}
</style></head><body><main class="wrap"><header class="hero"><div class="icon">✦</div><div><h1>Car Care</h1><p class="sub">General automotive education assistant for maintenance, troubleshooting, and ownership checklists.</p></div></header>
<section class="chat"><div id="messages" class="messages"><div class="msg bot">Hi! I’m Car Care. What would you like to work on?</div></div><form id="form" class="composer"><textarea id="input" placeholder="Type your message..." required></textarea><button id="send">Send</button></form></section><div class="hint">Gemini-powered • API key comes from Render Environment Variables</div></main>
<script>
const f=document.getElementById("form"),i=document.getElementById("input"),m=document.getElementById("messages"),s=document.getElementById("send");
function add(t,c){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight;return d}
f.onsubmit=async e=>{e.preventDefault();let t=i.value.trim();if(!t)return;add(t,"user");i.value="";s.disabled=true;let x=add("Thinking…","bot");try{let r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t})}),d=await r.json();x.remove();add(d.reply||d.error||"Something went wrong.","bot")}catch(e){x.remove();add("Server connection failed. Please try again.","bot")}finally{s.disabled=false;i.focus()}};
i.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();f.requestSubmit()}}
</script></body></html>
